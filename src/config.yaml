raw_data_path: mini_project_2_data.csv
cleaned_data_path: data/cleaned_data.csv
target_column: no_show
id_column: booking_id
sgd_to_usd_rate: 1.28

split_ratios:
  test_size: 0.20
  val_size: 0.50
  random_state: 42

numerical_features:
  - price_usd
  - stay_duration
  - num_adults
  - num_children
  - arrival_day
  - checkout_day

categorical_features:
  - branch
  - booking_month
  - arrival_month
  - checkout_month
  - country
  - first_time
  - room
  - platform

hyperparameter_grids:
  decision_tree:
    classifier__max_depth: [5, 10, 15, null]
    classifier__min_samples_split: [2, 5, 10]
    classifier__criterion: ["gini", "entropy"]

model_save_path: models/best_no_show_model.joblib
